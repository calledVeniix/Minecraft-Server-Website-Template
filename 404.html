<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page not found</title>
  <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Outfit:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .err { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .err__box { padding: 54px 44px; max-width: 560px; }
    .err__code { font-family: var(--font-display); font-size: clamp(64px, 16vw, 130px); line-height: 1;
      background: linear-gradient(135deg, var(--c-secondary), var(--c-primary), var(--c-accent));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .err__logo { width: 110px; margin: 0 auto 22px; animation: floatY 6s ease-in-out infinite;
      filter: drop-shadow(0 0 40px rgba(var(--c-primary-rgb), .6)); }
    .err p { color: var(--text-soft); margin: 14px 0 28px; }
  </style>
</head>
<body>
  <div class="bg-layer">
    <div class="aurora aurora--1"></div>
    <div class="aurora aurora--2"></div>
  </div>
  <div class="bg-grid"></div>

  <main class="err">
    <div class="err__box glass">
      <img class="err__logo" src="assets/img/logo.webp" alt="Logo" width="110" height="110" />
      <div class="err__code">404</div>
      <h1 style="font-size:24px;margin-top:8px">This block does not exist</h1>
      <p>The page you are looking for was mined away, or there is a typo in the address.</p>
      <!-- Link back to the homepage. On a custom domain you can also use href="/". -->
      <a class="btn btn--primary" href="./">Back to the homepage</a>
    </div>
  </main>
</body>
</html>
